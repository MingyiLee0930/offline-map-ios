<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="離線地圖">
<meta name="theme-color" content="#F6F3EC">
<title>離線地圖</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<!-- 頂部狀態列 -->
<header class="topbar">
  <button id="coordChip" class="chip glass" aria-label="目前座標">
    <span class="gps-dot" id="gpsDot"></span>
    <span id="coordText" class="mono">等待 GPS…</span>
  </button>
  <div class="chip glass alt-chip"><span class="lbl">海拔</span><b id="altText" class="mono">—</b><span class="lbl">m</span></div>
</header>
<div class="subchips"><span id="netChip" class="net-chip hidden">離線模式</span><button id="expChip" class="exp-chip hidden"></button></div>

<!-- 偏離路線警示 -->
<button id="offBanner" class="banner hidden">
  <svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17.5v.01"/></svg>
  <span><b>已偏離路線 <span id="offDist" class="mono"></span></b><small id="offHint"></small></span>
</button>

<!-- 右側浮動按鈕 -->
<div class="fabs top">
  <button class="fab glass" id="btnLayers" aria-label="圖層"><svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 16 10 5 10-5"/></svg></button>
  <button class="fab glass hidden" id="btnCompass" aria-label="回到北朝上"><svg viewBox="0 0 24 24" class="needle"><path d="M12 2.5 16.5 12h-9Z" fill="#C4533A" stroke="none"/><path d="M12 21.5 7.5 12h9Z" fill="currentColor" stroke="none" opacity=".35"/></svg></button>
  <button class="fab glass" id="btnSettings" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/></svg></button>
</div>

<div class="fabs bottom" id="fabsBottom">
  <button class="fab glass rec-only" id="btnDim" aria-label="省電暗幕"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
  <button class="fab glass rec-only" id="btnWpt" aria-label="標記航點"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg></button>
  <button class="fab glass" id="btnLocate" aria-label="定位"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg></button>
</div>

<!-- 導航資訊卡 -->
<section id="navCard" class="navcard glass hidden">
  <button id="timeWarn" class="time-warn hidden"></button>
  <div class="stats">
    <div><span class="lbl">時間</span><b id="stTime" class="mono">0:00:00</b></div>
    <div><span class="lbl">距離</span><b id="stDist" class="mono">0.00</b><span class="unit">km</span></div>
    <div><span class="lbl">爬升</span><b id="stUp" class="mono">0</b><span class="unit">m</span></div>
    <div><span class="lbl">速度</span><b id="stSpd" class="mono">0.0</b><span class="unit">km/h</span></div>
  </div>
  <div id="routeRow" class="route-row hidden">
    <div class="route-meta"><span id="rtName" class="rt-name"></span><span id="rtLeft" class="mono"></span></div>
    <div class="progress"><i id="rtBar"></i></div>
  </div>
  <div id="timeRow" class="time-row hidden"></div>
</section>

<!-- 底部工具列 -->
<nav class="dock glass">
  <button data-sheet="routes"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg><span>路線</span></button>
  <button data-sheet="download"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>下載</span></button>
  <button id="btnStart" class="start" aria-label="開始">
    <span class="start-in"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5L8 5.5Z"/></svg><svg class="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg></span>
    <span class="start-lbl" id="startLbl">開始</span>
  </button>
  <button data-sheet="tracks"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/><path d="M12 7.5V12l3 2"/></svg><span>紀錄</span></button>
  <button data-sheet="sos"><svg viewBox="0 0 24 24"><path d="M12 21.5s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>座標</span></button>
</nav>

<!-- 底部抽屜 -->
<div id="backdrop" class="backdrop"></div>
<section id="sheet" class="sheet" aria-hidden="true">
  <div class="sheet-grip"></div>
  <header class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetClose" aria-label="關閉"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<!-- 對話框 -->
<div id="dialog" class="dialog hidden"><div class="dialog-box"><h3 id="dlgTitle"></h3><div id="dlgMsg"></div><div class="dlg-actions" id="dlgActions"></div></div></div>

<!-- 省電暗幕 -->
<div id="dim" class="dim hidden">
  <div class="dim-time mono" id="dimClock">--:--</div>
  <div class="dim-grid">
    <div><span>時間</span><b class="mono" id="dimElapsed">0:00:00</b></div>
    <div><span>距離 km</span><b class="mono" id="dimDist">0.00</b></div>
    <div><span>海拔 m</span><b class="mono" id="dimAlt">—</b></div>
    <div><span>爬升 m</span><b class="mono" id="dimUp">0</b></div>
  </div>
  <div class="dim-off hidden" id="dimOff"></div>
  <p class="dim-hint">輕點兩下返回地圖</p>
</div>

<input type="file" id="gpxInput" multiple hidden>
<input type="file" id="restoreInput" hidden>
<div id="toast" class="toast"></div>

<script src="vendor/capacitor.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-rotate.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
