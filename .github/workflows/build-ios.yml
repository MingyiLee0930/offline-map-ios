name: 打包 iPhone App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝套件
        run: npm install --no-audit --no-fund

      - name: 建立 iOS 專案
        run: npx cap add ios

      - name: 設定權限、背景定位、圖示
        run: bash scripts/configure-ios.sh

      - name: 同步網頁程式
        run: npx cap sync ios

      - name: 編譯（未簽署）
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 80

      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry OfflineMap.ipa Payload
          ls -lh OfflineMap.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineMap-ipa
          path: OfflineMap.ipa
          retention-days: 30
